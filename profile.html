<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>Profil - Arbeitszeiten</title>
    <link rel="stylesheet" href="styles.css?v=30" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="Kopfbereich">
        <div>
          <h1>Profil</h1>
        </div>
        <a class="icon-button back-link" href="index.html" id="backToDashboard" aria-label="Zurück zum Dashboard">
          <span aria-hidden="true">‹</span>
        </a>
      </section>

      <section class="panel profile-panel" aria-label="Basisdaten bearbeiten">
        <form class="profile-form" id="profileForm">
          <label>
            <span>Name</span>
            <input id="displayName" type="text" autocomplete="name" placeholder="Dein Name" />
          </label>
          <label>
            <span>Wochenstunden</span>
            <input id="weeklyHours" type="text" inputmode="decimal" />
          </label>
          <label>
            <span>Arbeitstage/Woche</span>
            <input id="workdaysPerWeek" type="number" min="1" max="7" step="1" inputmode="numeric" />
          </label>
          <label>
            <span>Urlaubstage/Jahr</span>
            <input id="vacationTotal" type="number" min="0" step="1" inputmode="numeric" />
          </label>
          <label>
            <span>Bereits genommen</span>
            <input id="vacationUsed" type="number" min="0" step="1" inputmode="numeric" />
          </label>
          <label>
            <span>Überstunden vorhanden</span>
            <input id="overtimeBalance" type="text" inputmode="decimal" />
          </label>
          <label>
            <span>Krankheitstage bisher</span>
            <input id="sickUsed" type="number" min="0" step="1" inputmode="numeric" />
          </label>

          <button class="primary-button" type="submit">Speichern</button>
        </form>
      </section>
    </main>

    <script src="profile.js?v=30"></script>
  </body>
</html>
